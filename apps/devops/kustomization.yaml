
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml


# This file tells Kubernetes tooling which YAML files form your application configuration. Kustomize can render these files together, and Argo CD can use them as one application.